<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Spatial Lab · 3D 模型库</title>
<style>
:root{--bg:#05070b;--panel:#0c1219;--line:#1b2534;--fg:#e8eef8;--dim:#8b9ab0;--muted:#5b6a80;
--accent:#38e0c8;--accent2:#7b6cff;--mono:ui-monospace,Consolas,monospace}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--fg);font:14px/1.6 -apple-system,"Segoe UI","Microsoft YaHei",system-ui,sans-serif}
a{color:inherit;text-decoration:none}
header{position:sticky;top:0;z-index:10;background:rgba(5,7,11,.94);backdrop-filter:blur(10px);
border-bottom:1px solid var(--line);padding:14px 22px}
.hd{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px}
.mark{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;
background:linear-gradient(135deg,rgba(56,224,200,.18),rgba(123,108,255,.18));
border:1px solid rgba(56,224,200,.35);color:var(--accent)}
.brand b{font-size:15px}
.brand small{display:block;color:var(--muted);font-size:11px}
.sp{flex:1}
input#q{background:#0a1018;border:1px solid #24313f;color:var(--fg);padding:8px 12px;border-radius:9px;
font-size:12.5px;outline:none;min-width:220px}
input#q:focus{border-color:rgba(56,224,200,.5)}
.nav{display:flex;gap:8px}
.navbtn{border:1px solid #24313f;background:#101823;color:var(--dim);padding:6px 14px;border-radius:9px;
font-size:12.5px;transition:.15s}
.navbtn:hover{border-color:rgba(56,224,200,.45);color:#fff}
.navbtn.on{background:linear-gradient(135deg,rgba(56,224,200,.9),rgba(58,168,224,.9));
border-color:transparent;color:#04120f;font-weight:600}
.notice{margin-top:10px;font-size:11.8px;color:var(--muted);line-height:1.7;
background:rgba(56,224,200,.05);border:1px solid rgba(56,224,200,.18);border-radius:9px;padding:8px 12px}
.notice b{color:var(--accent);font-weight:600}
.notice code{font-family:var(--mono);color:var(--dim);background:#0a1017;padding:1px 5px;border-radius:4px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.tab{border:1px solid #24313f;background:#101823;color:var(--dim);padding:5px 12px;border-radius:20px;
font-size:12px;cursor:pointer;transition:.15s}
.tab:hover{border-color:rgba(56,224,200,.4);color:#fff}
.tab.on{background:linear-gradient(135deg,rgba(56,224,200,.9),rgba(58,168,224,.9));
border-color:transparent;color:#04120f;font-weight:600}
main{padding:18px 22px 60px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:13px}
.card{border:1px solid var(--line);border-radius:13px;overflow:hidden;background:var(--panel);
cursor:pointer;transition:.16s}
.card:hover{border-color:rgba(56,224,200,.45);transform:translateY(-2px)}
.thumb{aspect-ratio:1/1;background:#070b11;display:grid;place-items:center;overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover}
.noimg{color:#2a3a4a;font-size:28px}
.meta{padding:9px 11px}
.meta b{font-size:12px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta span{color:var(--muted);font-size:10.5px;font-family:var(--mono);display:block;margin-top:2px}
.badge{position:absolute;right:8px;top:8px;font-size:9.5px;padding:2px 7px;border-radius:10px;
background:rgba(56,224,200,.15);border:1px solid rgba(56,224,200,.4);color:var(--accent)}
.card{position:relative}
.empty{color:var(--muted);padding:40px;text-align:center}
#modal{position:fixed;inset:0;background:rgba(3,5,9,.94);z-index:50;display:none;
align-items:center;justify-content:center;padding:20px}
#modal.on{display:flex}
#mbox{width:min(1100px,100%);height:min(760px,92vh);background:#080c12;border:1px solid var(--line);
border-radius:14px;display:flex;flex-direction:column;overflow:hidden}
#mbar{display:flex;align-items:center;gap:12px;padding:10px 15px;border-bottom:1px solid var(--line)}
#mbar b{font-size:13px}
#mbar span{color:var(--muted);font-size:11.5px;font-family:var(--mono)}
#mclose{margin-left:auto;background:#101823;border:1px solid #24313f;color:var(--fg);
padding:4px 12px;border-radius:8px;cursor:pointer;font-size:12px}
#mbody{flex:1;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden}
#mbody canvas{display:block}
#mbody img.big{max-width:100%;max-height:100%;object-fit:contain}
.hint{position:absolute;left:12px;bottom:12px;font-family:var(--mono);font-size:11px;color:var(--dim);
background:rgba(6,10,16,.8);border:1px solid var(--line);border-radius:8px;padding:5px 10px}
footer{border-top:1px solid var(--line);padding:16px 22px;color:var(--muted);font-size:11.5px}
.loadmore{display:block;margin:26px auto 0;background:#101823;border:1px solid #24313f;color:var(--fg);
padding:9px 26px;border-radius:9px;cursor:pointer;font-size:13px}
</style>
</head>
<body>
<header>
  <div class="hd">
    <div class="brand"><div class="mark">◈</div>
      <div><b>Spatial Lab · 3D 模型库</b><small id="sub">加载中…</small></div></div>
    <div class="sp"></div>
    <nav class="nav">
      <a class="navbtn on" href="./">素材库</a>
      <a class="navbtn" id="platformLink" href="#" title="完整平台需要本机开机">完整平台 →</a>
    </nav>
    <input id="q" placeholder="搜索模型名 / ID…">
  </div>
  <div class="notice">
    <b>这里是素材库</b>（1054 个模型，静态托管，随时可看）·
    <b>生成 / 高模细分 / UV 贴图 / FBX 导出</b> 需要本机跑完整平台 ——
    双击 <code>启动平台.bat</code> 后打开 <code>http://127.0.0.1:8791/</code>
  </div>
  <div class="tabs" id="tabs"></div>
</header>

<main>
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty" style="display:none">没有匹配的模型</div>
  <button class="loadmore" id="more" style="display:none">加载更多</button>
</main>

<footer>
  数据来源：Objaverse（LVIS 分类）· Poly Haven（CC0）· Khronos glTF 官方资产 · 本机生成
  ｜ 全量库在本地 Spatial Lab 运行
</footer>

<div id="modal"><div id="mbox">
  <div id="mbar"><b id="mtitle">—</b><span id="minfo"></span><button id="mclose">关闭</button></div>
  <div id="mbody"></div>
</div></div>

<script>
let DATA = [], FILTER = '全部', Q = '', SHOWN = 0, PAGE = 120;
const GRID = document.getElementById('grid');
const TABS = document.getElementById('tabs');
const GROUPS = ['全部', '高模', '人物', '车辆', '武器', '屋子', '其他'];

fetch('data.json').then(r => r.json()).then(d => {
  DATA = d.models;
  document.getElementById('sub').textContent = `${d.count} 个模型 · 全部本机生成或开源授权`;
  buildTabs();
  render(true);
}).catch(e => {
  document.getElementById('sub').textContent = '数据加载失败：' + e.message;
});

function count(g) {
  if (g === '全部') return DATA.length;
  if (g === '高模') return DATA.filter(m => m.tris > 5000).length;
  return DATA.filter(m => m.group === g).length;
}
function buildTabs() {
  TABS.innerHTML = GROUPS.map(g =>
    `<button class="tab ${g === FILTER ? 'on' : ''}" data-g="${g}">${g} ${count(g)}</button>`).join('');
  TABS.querySelectorAll('.tab').forEach(b => b.onclick = () => {
    FILTER = b.dataset.g; SHOWN = 0; buildTabs(); render(true);
  });
}
function filtered() {
  let list = DATA;
  if (FILTER === '高模') list = list.filter(m => m.tris > 5000);
  else if (FILTER !== '全部') list = list.filter(m => m.group === FILTER);
  if (Q) list = list.filter(m => (m.name + m.id).toLowerCase().includes(Q));
  return list.sort((a, b) => b.tris - a.tris);
}
function render(reset) {
  const list = filtered();
  if (reset) { GRID.innerHTML = ''; SHOWN = 0; }
  const slice = list.slice(SHOWN, SHOWN + PAGE);
  slice.forEach(m => GRID.appendChild(card(m)));
  SHOWN += slice.length;
  document.getElementById('empty').style.display = list.length ? 'none' : 'block';
  document.getElementById('more').style.display = (SHOWN < list.length) ? 'block' : 'none';
}
document.getElementById('more').onclick = () => render(false);

function card(m) {
  const el = document.createElement('div');
  el.className = 'card';
  const badge = m.model ? '<span class="badge">可查看</span>' : '';
  el.innerHTML = `${badge}
    <div class="thumb">${m.thumb
      ? `<img loading="lazy" src="${m.thumb}" onerror="this.parentNode.innerHTML='<span class=noimg>◈</span>'">`
      : '<span class="noimg">◈</span>'}</div>
    <div class="meta"><b title="${m.name}">${m.name}</b>
      <span>${m.tris ? m.tris.toLocaleString() + ' 面' : ''} · ${fmtKB(m.kb)}</span></div>`;
  el.onclick = () => open3d(m);
  return el;
}
function fmtKB(kb) { return kb > 1024 ? (kb / 1024).toFixed(1) + ' MB' : Math.round(kb) + ' KB'; }

/* ── 弹层：有 glb 就 3D 看，没有就看大图 ── */
const MODAL = document.getElementById('modal');
const MBODY = document.getElementById('mbody');
let R = null;
document.getElementById('mclose').onclick = closeModal;
MODAL.onclick = (e) => { if (e.target === MODAL) closeModal(); };

function closeModal() {
  MODAL.classList.remove('on');
  MBODY.innerHTML = '';
  if (R) { try { R.dispose(); } catch (e) {} R = null; }
}

function open3d(m) {
  document.getElementById('mtitle').textContent = m.name;
  document.getElementById('minfo').textContent =
    (m.model ? '可在线旋转查看' : '仅预览图') + ' · ' + (m.tris ? m.tris.toLocaleString() + ' 面' : '') + ' · ' + fmtKB(m.kb);
  MODAL.classList.add('on');
  MBODY.innerHTML = '';
  if (!m.model) {
    MBODY.innerHTML = `<img class="big" src="${m.thumb}">`;
    return;
  }
  MBODY.innerHTML = '<div style="color:#5b6a80">加载 3D…</div>';
  loadThree().then(() => startViewer(m)).catch(e => {
    MBODY.innerHTML = `<img class="big" src="${m.thumb}">`;
  });
}

let _threeReady = null;
function loadThree() {
  if (_threeReady) return _threeReady;
  const load = (src) => new Promise((res, rej) => {
    const s = document.createElement('script'); s.src = src;
    s.onload = res; s.onerror = rej; document.head.appendChild(s);
  });
  _threeReady = load('https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js')
    .then(() => Promise.all([
      load('https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js'),
      load('https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js'),
    ]));
  return _threeReady;
}

function startViewer(m) {
  MBODY.innerHTML = '';
  const w = MBODY.clientWidth, h = MBODY.clientHeight;
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x070b11);
  const cam = new THREE.PerspectiveCamera(42, w / h, 0.01, 5000);
  const rn = new THREE.WebGLRenderer({ antialias: true });
  rn.setPixelRatio(Math.min(devicePixelRatio, 2));
  rn.setSize(w, h);
  MBODY.appendChild(rn.domElement);
  scene.add(new THREE.HemisphereLight(0xcfe6ff, 0x24303c, 1.2));
  const k = new THREE.DirectionalLight(0xffffff, 1.5); k.position.set(3, 5, 4); scene.add(k);
  const f = new THREE.DirectionalLight(0x7b6cff, 0.7); f.position.set(-4, 2, -3); scene.add(f);
  const ctrl = new THREE.OrbitControls(cam, rn.domElement);
  ctrl.enableDamping = true; ctrl.dampingFactor = 0.08;
  const grid = new THREE.GridHelper(10, 20, 0x1d2b3a, 0x141d28);
  grid.position.y = -1; scene.add(grid);

  let root = null;
  new THREE.GLTFLoader().load(m.model, (g) => {
    root = g.scene;
    scene.add(root);
    const box = new THREE.Box3().setFromObject(root);
    const c = box.getCenter(new THREE.Vector3());
    const s = box.getSize(new THREE.Vector3());
    const d = Math.max(s.x, s.y, s.z) * 2.1;
    cam.position.set(c.x + d * 0.7, c.y + d * 0.5, c.z + d * 0.8);
    cam.near = d / 1000; cam.far = d * 100; cam.updateProjectionMatrix();
    ctrl.target.copy(c); ctrl.update();
    grid.position.y = box.min.y - d * 0.01;
    const g2 = Math.max(d * 3, 2); grid.scale.set(g2 / 10, 1, g2 / 10);
    MBODY.querySelector('div') && MBODY.querySelector('div').remove();
  }, undefined, () => {
    MBODY.innerHTML = `<img class="big" src="${m.thumb}">`;
  });

  const hud = document.createElement('div');
  hud.className = 'hint'; hud.textContent = '拖拽旋转 · 滚轮缩放 · 右键平移';
  MBODY.appendChild(hud);

  let raf = 0;
  const loop = () => { raf = requestAnimationFrame(loop); ctrl.update(); rn.render(scene, cam); };
  loop();
  R = { dispose() { cancelAnimationFrame(raf); ctrl.dispose(); rn.dispose(); } };
}

function showPlatformHelp(e) {
  e.preventDefault();
  alert('完整平台（生成 / 高模 / UV / FBX）需要在这台电脑上运行：

'
    + '1. 双击 D:\\DSH视频\\spatial-lab\\启动平台.bat
'
    + '2. 浏览器打开 http://127.0.0.1:8791/

'
    + '本页（素材库）是静态托管，随时可看、不依赖开机。');
}
document.getElementById('platformLink').addEventListener('click', showPlatformHelp);

document.getElementById('q').oninput = (e) => { Q = e.target.value.trim().toLowerCase(); render(true); };
window.addEventListener('resize', () => { if (R) closeModal(); });
</script>
</body>
</html>
